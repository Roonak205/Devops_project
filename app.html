<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .pipeline {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 30px 0;
        }

        .step {
            flex: 1;
            padding: 20px 10px;
            background: #f4f4f4;
            border-radius: 10px;
        }

        .step h3 {
            color: #444;
            margin-bottom: 8px;
        }

        .step p {
            color: #777;
            font-size: 14px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #message {
            margin-top: 20px;
            color: #333;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .pipeline {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps Demo Application</h1>

        <p class="subtitle">
            Node.js + Docker + Jenkins
        </p>

        <div class="status">
            Application Running Successfully
        </div>

        <div class="pipeline">

            <div class="step">
                <h3>GitHub</h3>
                <p>Source Code</p>
            </div>

            <div class="step">
                <h3>Jenkins</h3>
                <p>CI/CD Pipeline</p>
            </div>

            <div class="step">
                <h3>Docker</h3>
                <p>Container</p>
            </div>

            <div class="step">
                <h3>AWS</h3>
                <p>Deployment</p>
            </div>

        </div>

        <button onclick="showMessage()">
            Test Application
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "✅ Application is working! Changes can be deployed through Jenkins.";
        }
    </script>

</body>
</html>
